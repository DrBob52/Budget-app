name: Tally
options:
  bundleIdPrefix: com.tallybudget
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    # Set your team here (or in Xcode → Signing & Capabilities) before running on a device.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES

packages:
  TallyCore:
    path: Packages/TallyCore

targets:
  Tally:
    type: application
    platform: iOS
    sources:
      - path: Tally
    dependencies:
      - package: TallyCore
      - target: TallyWidgets
      - target: TallyWatch
    info:
      path: Tally/Resources/Info.plist
      properties:
        CFBundleDisplayName: Tally
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, es]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: AccentColor
          UIImageRespectsSafeAreaInsets: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSFaceIDUsageDescription: Tally uses Face ID to keep your budget private.
        CFBundleURLTypes:
          - CFBundleURLName: com.tallybudget.app
            CFBundleURLSchemes:
              - tally
        ITSAppUsesNonExemptEncryption: false
        NSUserActivityTypes:
          - LogExpenseIntent
    entitlements:
      path: Tally/Resources/Tally.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.tallybudget.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tallybudget.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: YES

  TallyWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: TallyWidgets
    dependencies:
      - package: TallyCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: TallyWidgets/Info.plist
      properties:
        CFBundleDisplayName: Tally
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, es]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: TallyWidgets/TallyWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.tallybudget.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tallybudget.app.widgets
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES

  TallyWatch:
    type: application
    platform: watchOS
    sources:
      - path: TallyWatch
    dependencies:
      - package: TallyCore
    info:
      path: TallyWatch/Info.plist
      properties:
        CFBundleDisplayName: Tally
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, es]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.tallybudget.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tallybudget.app.watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SKIP_INSTALL: YES

  TallyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TallyTests
    dependencies:
      - target: Tally
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tallybudget.app.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Tally:
    build:
      targets:
        Tally: all
        TallyTests: [test]
    run:
      config: Debug
      storeKitConfiguration: Configuration/Tally.storekit
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - TallyTests
        - package: TallyCore/TallyCoreTests
    archive:
      config: Release
  TallyWatch:
    build:
      targets:
        TallyWatch: all
    run:
      config: Debug
