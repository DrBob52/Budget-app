name: Export strings

# Run by hand: exports every translatable string to Localization/es.xliff on the same branch,
# so translations can be prepared against Xcode's exact keys.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Export Spanish localization
        run: |
          xcodebuild -exportLocalizations \
            -project Tally.xcodeproj \
            -localizationPath build/localizations \
            -exportLanguage es \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO | tail -20
      - name: Commit the XLIFF
        run: |
          mkdir -p Localization
          cp "build/localizations/es.xcloc/Localized Contents/es.xliff" Localization/es.xliff
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add Localization/es.xliff
          git commit -m "Export Spanish strings for translation" || exit 0
          git push
