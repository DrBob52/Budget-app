name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: TallyCore tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Run package tests
        run: swift test --package-path Packages/TallyCore

  build:
    name: Build iOS app, widgets and watch app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build iOS app (simulator)
        run: |
          set -o pipefail
          xcodebuild build \
            -project Tally.xcodeproj \
            -scheme Tally \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            -quiet 2>&1 | tee build.log
      - name: Run app unit tests
        run: |
          set -o pipefail
          DEVICE=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          xcodebuild test \
            -project Tally.xcodeproj \
            -scheme Tally \
            -destination "id=$DEVICE" \
            -only-testing:TallyTests \
            CODE_SIGNING_ALLOWED=NO \
            -quiet 2>&1 | tee test.log
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: "*.log"
